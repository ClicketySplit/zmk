description: |
  GPIO-controlled rail that remains enabled during normal operation and
  ordinary idle, and is disabled during device-PM suspend before deep sleep.

compatible: "zmk,pm-gpio-rail"

properties:
  enable-gpios:
    type: phandle-array
    required: true
    description: GPIO used to enable the rail.

  init-delay-ms:
    type: int
    required: false
    description: Delay after enabling the rail during initialization or resume.
