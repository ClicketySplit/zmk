#
# Leeloo-Micro v1.1/rev2 common shield configuration.
#
# The nice!nano v2-specific RGB MOSFET and direct Sharp display
# configuration is contained in:
#
#   boards/clickety_split_leeloo_micro_rev2_left/
#       nice_nano_nrf52840_zmk_2_0_0.conf
#
#   boards/clickety_split_leeloo_micro_rev2_right/
#       nice_nano_nrf52840_zmk_2_0_0.conf
#
# Those controller-specific files automatically:
#
#   - enable RGB underglow;
#   - redirect ZMK EXT_POWER to active-low P1.01;
#   - keep the display/VCC supply enabled through P0.13;
#   - configure P0.06 as the WS2812 data output;
#   - configure 20 GRB LEDs per half;
#   - enable the direct 160 x 68 Sharp Memory LCD;
#   - start RGB disabled at restricted validation brightness.
#
# Do not enable the former ZMK power-domain implementation.
# Do not add nice_view_adapter or nice_view to rev2 nice!nano v2 builds.
#
# This common file is intentionally limited to documentation and future
# revision-wide settings. Hardware-specific settings must remain in the
# controller-specific files so other revisions and controllers are not
# affected.
