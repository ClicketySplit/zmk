#
# Leeloo-Micro v1.1/rev2 RGB MOSFET compatibility.
#
# ZMK EXT_POWER is redirected by the controller-specific overlay from the
# nice!nano VCC output on P0.13 to the active-low RGB MOSFET gate on P1.01.
#
# The PM-aware P0.13 display/VCC rail remains enabled during normal
# operation and ordinary idle, then is disabled before deep sleep and
# restored on wake. RGB begins disabled. The 10% maximum brightness is the
# conservative production setting selected to protect battery life.

CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=y
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n

CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=10
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=10

# Leeloo-Micro Sharp memory-in-pixel display
#
# The controller-specific overlay directly defines the 160 x 68 Sharp
# display. Do not add the nice_view_adapter or nice_view shields.
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=4096
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y

# Sharp LS0XX is a one-bit monochrome memory display.
CONFIG_LV_COLOR_DEPTH_1=y
CONFIG_LV_Z_BITS_PER_PIXEL=1
CONFIG_LV_USE_THEME_MONO=y
CONFIG_LV_Z_VDB_SIZE=100

# Use ZMK's built-in status screen.
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=y
CONFIG_ZMK_LV_FONT_DEFAULT_SMALL_MONTSERRAT_12=y
CONFIG_LV_FONT_DEFAULT_MONTSERRAT_16=y

CONFIG_ZMK_WIDGET_WPM_STATUS=n
CONFIG_ZMK_WIDGET_BATTERY_STATUS=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y

# Production deep-sleep policy for the PM-aware display/VCC rail.
#
# ZMK derives CONFIG_ZMK_PM_DEVICE_SUSPEND_RESUME automatically. Do not assign
# that hidden symbol directly in this controller-specific configuration.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000
