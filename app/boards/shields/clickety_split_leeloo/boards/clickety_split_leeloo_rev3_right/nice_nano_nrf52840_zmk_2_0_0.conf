#
# Temporary Leeloo rev3 RGB MOSFET compatibility experiment.
#
# RGB underglow uses ZMK EXT_POWER, redirected by the controller-specific
# overlay from nice!nano P0.13 to the active-low MOSFET gate on P1.01.
#
# Brightness is intentionally restricted during initial hardware validation.

CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=y
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n

CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=10
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=10
