# Pepito shares the XIAO SPI bus between its 74HC595-compatible
# matrix expander and its directly connected Sharp Memory LCD.
CONFIG_SPI=y

# Pepito owns its display directly. Neither nice_view nor
# nice_view_adapter should be added to the build command.
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=y
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=4096
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y

# The right half is a split peripheral and must not expose USB HID.
# This also avoids the expected Kconfig dependency warning caused by
# the application-wide USB default used by central-capable builds.
CONFIG_ZMK_USB=n
