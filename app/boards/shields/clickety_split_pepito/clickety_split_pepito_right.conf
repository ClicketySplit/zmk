# Pepito shares the XIAO SPI bus between its 74HC595-compatible
# matrix expander and its directly connected Sharp Memory LCD.
CONFIG_SPI=y

# Pepito interfaces with its display directly.
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=y
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=4096
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y

CONFIG_ZMK_USB=n
